apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: produccion
  labels:
    app: frontend-ui
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-ui
  template:
    metadata:
      labels:
        app: frontend-ui
        tier: frontend
    spec:
      nodeSelector:
        tier: frontend
      containers:
      - name: frontend
        image: nginx:alpine
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "300m"
            memory: "128Mi"
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: produccion
spec:
  selector:
    app: frontend-ui
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
